<!DOCTYPE html>
<html lang="en">
<head>
  <!-- basic setup stuff for the page -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to AI Evaluation</title>

  <!-- sends people straight to my Lab 2 page -->
  <meta http-equiv="refresh" content="0; url=ai-evaluation.html">

  <!-- tells search engines this is the real page -->
  <link rel="canonical" href="ai-evaluation.html">

  <!-- backup redirect in case meta refresh does not run -->
  <script>
    window.location.replace('ai-evaluation.html');
  </script>
</head>
<body>
  <!-- just in case redirects are blocked, this link still works -->
  <p>Redirecting to <a href="ai-evaluation.html">AI Evaluation</a>...</p>
</body>
</html>
