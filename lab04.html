<!DOCTYPE html>
<html lang="en">
<head>
  <!-- basic page setup -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Tableau Visualization</title>

  <!-- sends this old lab04 url to the real tableau page -->
  <meta http-equiv="refresh" content="0; url=tableau-visualization.html">

  <!-- tells search engines the main page for this content -->
  <link rel="canonical" href="tableau-visualization.html">

  <!-- backup redirect -->
  <script>
    window.location.replace('tableau-visualization.html');
  </script>
</head>
<body>
  <!-- fallback link if redirect does not fire -->
  <p>Redirecting to <a href="tableau-visualization.html">Tableau Visualization</a>...</p>
</body>
</html>
